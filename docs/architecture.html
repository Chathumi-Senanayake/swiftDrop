<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SwiftDrop Architecture</title>
<style>
  body { margin: 0; background: #ffffff; font-family: 'Segoe UI', system-ui, sans-serif; }
  svg text { font-family: 'Segoe UI', system-ui, sans-serif; }
</style>
</head>
<body>
<!-- Source of docs/architecture.png. Re-render with headless Edge/Chrome at 1600x1000. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e3a8a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="52" font-size="30" font-weight="800" fill="#0f172a">SwiftDrop – High-Level Architecture</text>
  <text x="40" y="82" font-size="16" fill="#475569">Path of a "Buy Now" request when 500–1,000 customers hit the same item at the same moment</text>

  <!-- ===== 1. Customers ===== -->
  <rect x="40" y="150" width="230" height="300" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="185" text-anchor="middle" font-size="19" font-weight="700" fill="#1e3a8a">Customers</text>
  <text x="155" y="208" text-anchor="middle" font-size="14" fill="#475569">500 – 1,000 browsers</text>
  <g font-size="13" fill="#0f172a">
    <rect x="52" y="230" width="210" height="200" rx="8" fill="#fff" stroke="#bfdbfe"/>
    <text x="62" y="255" font-weight="700">Browser protections</text>
    <text x="62" y="282">• Buy button disabled on click</text>
    <text x="62" y="304">  until server answers (FR-P05)</text>
    <text x="62" y="331">• Stock polled every 2 s</text>
    <text x="62" y="353">  (tiny /stock endpoint)</text>
    <text x="62" y="380">• Countdown runs locally,</text>
    <text x="62" y="402">  no server load</text>
  </g>

  <!-- arrow customers -> nginx -->
  <line x1="270" y1="300" x2="340" y2="300" stroke="#1e3a8a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="305" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">①</text>

  <!-- ===== 2. Nginx ===== -->
  <rect x="345" y="120" width="420" height="560" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="555" y="155" text-anchor="middle" font-size="20" font-weight="800" fill="#14532d">Nginx  (single entry point :8080)</text>

  <!-- rate limiter -->
  <rect x="370" y="175" width="370" height="230" rx="10" fill="#fff" stroke="#16a34a"/>
  <text x="390" y="203" font-size="17" font-weight="700" fill="#14532d">② Rate Limiter (leaky bucket)</text>
  <g font-size="13.5" fill="#0f172a">
    <text x="390" y="232">• Per user on /api/purchase: 2 req/s (burst 5)</text>
    <text x="406" y="252" fill="#475569">stops one person / bot spamming Buy Now</text>
    <text x="390" y="280">• Global cap on /api/purchase: 1,000 req/s</text>
    <text x="406" y="300" fill="#475569">app servers never receive more than they can handle</text>
    <text x="390" y="328">• Per IP on other /api: 30 req/s (burst 60)</text>
    <text x="390" y="356" font-weight="700" fill="#dc2626">Excess → instant 429 JSON</text>
    <text x="406" y="376" fill="#475569">"Lots of people are buying right now, try again"</text>
    <text x="406" y="394" fill="#475569">no timeouts, no crashes, no 5xx</text>
  </g>

  <!-- load balancer -->
  <rect x="370" y="425" width="370" height="230" rx="10" fill="#fff" stroke="#16a34a"/>
  <text x="390" y="453" font-size="17" font-weight="700" fill="#14532d">③ Load Balancer</text>
  <g font-size="13.5" fill="#0f172a">
    <text x="390" y="482">• least_conn: each request goes to the</text>
    <text x="406" y="502">server with the fewest active requests</text>
    <text x="390" y="530">• Health: a server failing 3× is skipped for 10 s</text>
    <text x="390" y="558">• Safe retry of GETs on another server</text>
    <text x="406" y="578" fill="#475569">(POST purchases are never retried → no double buy)</text>
    <text x="390" y="606">• Keep-alive connections to the app servers</text>
    <text x="390" y="634">• 502/503/504 also returned as JSON</text>
  </g>

  <!-- rejected arrow -->
  <line x1="555" y1="680" x2="555" y2="760" stroke="#dc2626" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrowRed)"/>
  <rect x="430" y="765" width="250" height="56" rx="10" fill="#fef2f2" stroke="#dc2626"/>
  <text x="555" y="790" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">429 Too Many Requests</text>
  <text x="555" y="809" text-anchor="middle" font-size="12.5" fill="#991b1b">structured JSON, answered in &lt;1 ms</text>

  <!-- arrows nginx -> apps -->
  <line x1="765" y1="540" x2="850" y2="230" stroke="#1e3a8a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="765" y1="540" x2="850" y2="420" stroke="#1e3a8a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="765" y1="540" x2="850" y2="610" stroke="#1e3a8a" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ===== 3. App servers ===== -->
  <g>
    <rect x="855" y="150" width="330" height="150" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="875" y="180" font-size="17" font-weight="700" fill="#7c2d12">app1  (Node.js + Express)</text>
    <rect x="855" y="340" width="330" height="150" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="875" y="370" font-size="17" font-weight="700" fill="#7c2d12">app2  (Node.js + Express)</text>
    <rect x="855" y="530" width="330" height="150" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="875" y="560" font-size="17" font-weight="700" fill="#7c2d12">app3  (Node.js + Express)</text>
  </g>
  <g font-size="13" fill="#0f172a">
    <!-- layers repeated in each box -->
    <g id="layers">
      <rect x="875" y="195" width="290" height="26" rx="5" fill="#fff" stroke="#fdba74"/>
      <text x="885" y="213">Routes  – auth check, call service</text>
      <rect x="875" y="226" width="290" height="26" rx="5" fill="#fff" stroke="#fdba74"/>
      <text x="885" y="244">Services – business rules (purchase logic)</text>
      <rect x="875" y="257" width="290" height="26" rx="5" fill="#fff" stroke="#fdba74"/>
      <text x="885" y="275">Models – data access (Mongoose)</text>
    </g>
    <use href="#layers" y="190"/>
    <use href="#layers" y="380"/>
  </g>
  <text x="1020" y="710" text-anchor="middle" font-size="13" fill="#475569">Stateless: any server can handle any request</text>
  <text x="1020" y="730" text-anchor="middle" font-size="13" fill="#475569">(sessions + stock live in MongoDB, images on a shared volume)</text>

  <!-- arrows apps -> mongo -->
  <line x1="1185" y1="225" x2="1265" y2="400" stroke="#1e3a8a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1185" y1="415" x2="1265" y2="415" stroke="#1e3a8a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1185" y1="605" x2="1265" y2="430" stroke="#1e3a8a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1225" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">④</text>

  <!-- ===== 4. MongoDB ===== -->
  <rect x="1262" y="150" width="326" height="530" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1425" y="185" text-anchor="middle" font-size="20" font-weight="800" fill="#4c1d95">MongoDB</text>
  <text x="1425" y="207" text-anchor="middle" font-size="13" fill="#475569">single source of truth</text>

  <rect x="1276" y="225" width="290" height="190" rx="10" fill="#fff" stroke="#7c3aed"/>
  <text x="1288" y="250" font-size="15" font-weight="700" fill="#4c1d95">⑤ Atomic stock decrement</text>
  <g font-size="12.5" fill="#0f172a" font-family="Consolas, monospace">
    <text x="1288" y="278">items.findOneAndUpdate(</text>
    <text x="1288" y="297">  { _id, stock: { $gt: 0 } },</text>
    <text x="1288" y="316">  { $inc: { stock: -1 } })</text>
  </g>
  <g font-size="12.5" fill="#475569">
    <text x="1288" y="344">One indivisible step on one document:</text>
    <text x="1288" y="362">"take 1 only if any are left".</text>
    <text x="1288" y="380">1,000 requests, stock 100 → exactly 100 win,</text>
    <text x="1288" y="398" font-weight="700" fill="#16a34a">900 get "Sold out". Zero oversell.</text>
  </g>

  <rect x="1276" y="430" width="290" height="105" rx="10" fill="#fff" stroke="#7c3aed"/>
  <text x="1288" y="455" font-size="15" font-weight="700" fill="#4c1d95">⑥ Unique index on orders</text>
  <g font-size="12.5" fill="#475569">
    <text x="1288" y="478">(userId, itemId) where active = true</text>
    <text x="1288" y="498">The database itself rejects a 2nd purchase</text>
    <text x="1288" y="518">of the same item, even from 2 servers at once.</text>
  </g>

  <rect x="1276" y="550" width="290" height="115" rx="10" fill="#fff" stroke="#7c3aed"/>
  <text x="1288" y="575" font-size="15" font-weight="700" fill="#4c1d95">⑦ Reserve → Confirm</text>
  <g font-size="12.5" fill="#475569">
    <text x="1288" y="598">reserved → confirmed  (atomic status change)</text>
    <text x="1288" y="618">reserved → cancelled  (+1 stock back)</text>
    <text x="1288" y="638">Unpaid after 5 min → auto-released by a</text>
    <text x="1288" y="656">background job (runs safely on all servers)</text>
  </g>

  <!-- ===== Bottom: request walk-through ===== -->
  <rect x="40" y="850" width="1530" height="125" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="878" font-size="16" font-weight="800" fill="#0f172a">Purchase request walk-through</text>
  <g font-size="13.5" fill="#334155">
    <text x="60" y="904">① Customer clicks Buy Now → button locks.  ② Nginx checks the rate limits; excess requests get a friendly 429 right away.  ③ The rest are spread over 3 app servers.</text>
    <text x="60" y="926">④ App server checks login + event is Live.  ⑤ ONE atomic MongoDB command reserves a unit only if stock &gt; 0.  ⑥ Unique index blocks duplicate buys.</text>
    <text x="60" y="948">⑦ Customer sees the payment step; Confirm → order Confirmed, Cancel/timeout → unit returned to stock.  Every outcome is a clear JSON message: success, sold out, already purchased, busy.</text>
  </g>
</svg>
</body>
</html>
