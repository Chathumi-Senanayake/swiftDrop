# Nginx = the front door. Every request passes through here first.
#  0. WEB APP       - serves the built React files directly (they never reach the app servers)
#  1. RATE LIMITER  - drops excess requests early with a clean JSON 429 (protects the app servers)
#  2. LOAD BALANCER - spreads the remaining requests across 3 app servers

worker_processes auto;
events {
  worker_connections 8192;
}

http {
  # File types (so the browser runs .js as JavaScript, .css as CSS, ...)
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ---------- Load balancer ----------
  # least_conn = send each request to the server with the fewest active requests
  upstream swiftdrop_app {
    least_conn;
    server app1:3000 max_fails=3 fail_timeout=10s;
    server app2:3000 max_fails=3 fail_timeout=10s;
    server app3:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  # ---------- Rate limiter zones ----------
  # General API traffic: 30 requests/second per IP address
  limit_req_zone $binary_remote_addr zone=per_ip:10m rate=30r/s;

  # Purchase endpoint, per USER (their login token), falling back to IP when not logged in.
  # Stops one person (or bot) from spamming Buy Now.
  map $http_authorization $user_key {
    default $http_authorization;
    ""      $binary_remote_addr;
  }
  limit_req_zone $user_key zone=purchase_per_user:10m rate=2r/s;

  # Purchase endpoint, GLOBAL cap for the whole platform: the app servers never receive
  # more purchase requests than they can handle. Extra requests get an instant 429.
  limit_req_zone $server_name zone=purchase_global:1m rate=1000r/s;

  limit_req_status 429;

  server {
    listen 80;
    client_max_body_size 30m; # event images

    # Errors are always JSON, never an HTML error page
    error_page 429 = @too_many_requests;
    error_page 502 503 504 = @unavailable;

    location @too_many_requests {
      default_type application/json;
      return 429 '{"error":{"code":"RATE_LIMITED","message":"Lots of people are buying right now. Please wait a moment and try again."}}';
    }
    location @unavailable {
      default_type application/json;
      return 503 '{"error":{"code":"UNAVAILABLE","message":"The service is busy. Please try again in a few seconds."}}';
    }

    # Settings for passing requests on to the app servers
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    # If a server is down, retry the request on another one (safe requests only - never repeats a POST)
    proxy_next_upstream error timeout http_502 http_503;

    # Buying: strictest limits
    location /api/purchase/ {
      limit_req zone=purchase_per_user burst=5 nodelay;
      limit_req zone=purchase_global burst=2000 nodelay;
      proxy_pass http://swiftdrop_app;
    }

    # All other API calls
    location /api/ {
      limit_req zone=per_ip burst=60 nodelay;
      proxy_pass http://swiftdrop_app;
    }

    # Uploaded event / item images (stored by the app servers)
    location /uploads/ {
      proxy_pass http://swiftdrop_app;
      expires 5m;
    }

    # React build: JS/CSS file names contain a content hash, so browsers may cache them for a long time
    location /assets/ {
      root /usr/share/nginx/html;
      expires 1y;
    }

    # React app: any other URL (e.g. /events/123) gets index.html and React Router shows the right page
    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}
